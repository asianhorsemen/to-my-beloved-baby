<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutie Page</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffd6e7;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow-x: hidden;
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Pixel grid background */
        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(to right, rgba(255, 182, 193, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 182, 193, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .page {
            margin-top: 100px;
            position: relative;
            padding: 20px;
            display: none;
        }

        .page.active {
            display: block;
        }

        #page4 img {
            width: 100px;
        }

        #image-0 {
            position: relative;
            top: 70px;
            width: 200px;
        }


        #image-1 {
            position: relative;
            top: 300px;
        }
        #image-2 {
            position: relative;
            bottom: 100px;
        }
        #image-3 {
            position: relative;
            top: 450px;
        }

        .image-1 {
            width: 200px;
            transition: transform 0.3s;
            filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.5));
        }

        .image-1:hover {
            transform: scale(1.1);
        }

        button {
            padding: 12px 24px;
            border: none;
            font-family: 'Press Start 2P', cursive, sans-serif;
            font-size: 12px;
            margin: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* Pixel-style buttons */
        .yes-button {
            background-color: #ff6b9d;
            color: white;
            box-shadow:
                4px 0 0 0 #d23d7a,
                0 4px 0 0 #d23d7a,
                4px 4px 0 0 #d23d7a;
            border: 2px solid #d23d7a;
        }

        .yes-button:hover {
            background-color: #ff4785;
            transform: translate(-2px, -2px);
            box-shadow:
                6px 2px 0 0 #d23d7a,
                2px 6px 0 0 #d23d7a,
                6px 6px 0 0 #d23d7a;
        }

        .yes-button:active {
            transform: translate(0, 0);
            box-shadow:
                2px 2px 0 0 #d23d7a,
                2px 2px 0 0 #d23d7a,
                2px 2px 0 0 #d23d7a;
        }

        .no-button {
            background-color: #d3d3d3;
            color: #333;
            box-shadow:
                4px 0 0 0 #a0a0a0,
                0 4px 0 0 #a0a0a0,
                4px 4px 0 0 #a0a0a0;
            border: 2px solid #a0a0a0;
            transition: all 0.5s ease;
            position: relative;
        }

        .no-button:hover {
            background-color: #c0c0c0;
            transform: translate(-2px, -2px);
        }

        h2 {
            color: #ff4785;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        #last-image {
            width: 150px;
        }

        /* Heart explosion effect */
@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
    }
}

.heart-explosion {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 100;
}

.heart-explosion .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 4s linear forwards;
    color: #ff6b9d;
}

        /* Heart particles */
        .heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            font-size: 16px;
            color: #ff6b9d;
            animation: float 3s ease-in-out forwards;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) rotate(20deg);
                opacity: 0;
            }
        }

        /* Add pixel font */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    </style>
</head>

<body>
    <div class="pixel-bg"></div>

    <!-- Page 1 -->
    <div class="page active" id="page1">
        <img src="qoobee-unscreen.gif" alt="" class="image-1">
        <h2>Hi cutie ❤️</h2>
        <button class="yes-button" id="yesBtn1">Yes cutie?</button>
        <button class="no-button" id="noBtn1">Go away</button>
    </div>

    <!-- Page 2 -->
    <div class="page" id="page2">
        <img src="Qoobee-Agapi-GIF-Qoobee-Agapi--unscreen.gif" alt="" class="image-1">
        <h2>Can i ask a question ? ❤️</h2>
        <button class="yes-button" id="yesBtn2">Sure why not</button>
        <button class="no-button" id="noBtn2">Get lost</button>
    </div>

    <!-- Page 3 -->
    <div class="page" id="page3">
        <img src="Love-You-Sticker-Love-You-Disc-unscreen.gif" alt="" class="image-1">
        <h2 id="page3Text">Will you go out on a moa date with me? ❤️</h2>
        <button class="yes-button" id="yesBtn3">i would love to!</button>
        <button class="no-button" id="noBtn3">hell no!</button>
    </div>

    <!-- Page 4 -->
    <div class="page" id="page4">
        <img src="Dance Love Sticker by Minto Inc (2).gif" alt="" id="image-1">
        <img src="Hello Kitty Hearts Sticker.gif" alt="" id="image-0">
        <img src="Dance Love Sticker by Minto Inc.gif" alt="" id="image-2">
        <img src="Dance Love Sticker by Minto Inc (1).gif" alt="" id="image-3">
        <h2>from 1–10 how much do you love me? ❤️</h2>
        <div id="heartClickArea" style="font-size: 50px; cursor: pointer;">❤️</div>
        <p id="heartCounter" style="font-size: 16px; color: #ff4785;">Hearts: 0/10</p>
    </div>



    <!-- Page 5 -->
    <div class="page" id="page5">
        <img src="Happy In Love Sticker by KIKI.gif" alt="" id="last-image">
        <h2>YAYY I LOVE YOU MORE</h2>
    </div>

    <script>
        // Initialize all pages and buttons
        const pages = [
            document.getElementById('page1'),
            document.getElementById('page2'),
            document.getElementById('page3'),
            document.getElementById('page4'),
            document.getElementById('page5')
        ];

        const yesButtons = [
            document.getElementById('yesBtn1'),
            document.getElementById('yesBtn2'),
            document.getElementById('yesBtn3'),
            document.getElementById('yesBtn4'),
            document.getElementById('yesBtn5')
        ];

        const noButtons = [
            document.getElementById('noBtn1'),
            document.getElementById('noBtn2'),
            document.getElementById('noBtn3'),
            document.getElementById('noBtn4'),
            document.getElementById('noBtn5')
        ];

        // Persuasive messages for page 3
        const persuasiveMessages = [
            "Please baby  ❤️",
            "pretty please ☹️",
            "I promise it will be fun",
            "baby pleaseee ☹️☹️",
            "well play at timezone ❤️❤️ "
        ];

        let noCount = 0;
        let yesSize = 1;

        // Set up event listeners for all buttons
        for (let i = 0; i < pages.length; i++) {
            // Yes button - go to next page
            yesButtons[i].addEventListener('click', () => {
                // Special behavior for page 3
                if (i === 2) {
                    yesSize += 0.2;
                    yesButtons[i].style.transform = `scale(${yesSize})`;

                    // Create celebration hearts
                    for (let j = 0; j < 5; j++) {
                        setTimeout(() => {
                            createRandomHeart();
                        }, j * 100);
                    }

                    // Move to next page after a short delay
                    setTimeout(() => {
                        pages[i].classList.remove('active');
                        pages[i + 1].classList.add('active');
                    }, 800); // optional delay for effect

                    return;
                }


                // If not last page, go to next page
                // If not last page, go to next page
if (i < pages.length - 1) {
    pages[i].classList.remove('active');
    pages[i + 1].classList.add('active');
    // Start heart explosion if going to last page
    if (i + 1 === pages.length - 1) {
        startHeartExplosion();
    }
}
            });

            let heartCount = 0;

            document.getElementById('heartClickArea').addEventListener('click', () => {
    heartCount++;
    document.getElementById('heartCounter').textContent = `Hearts: ${heartCount}/10`;

    // Create floating heart
    createRandomHeart();

    if (heartCount >= 10) {
        // Go to next page
        pages[3].classList.remove('active');
        pages[4].classList.add('active');
        startHeartExplosion();

        // Reset counter if needed
        heartCount = 0;
        document.getElementById('heartCounter').textContent = `Hearts: 0/10`;
    }
});

            // No button behavior
            if (i === 2) {
                // Special behavior for page 3
                noButtons[i].addEventListener('click', () => {
                    // Change text to be more persuasive
                    if (noCount < persuasiveMessages.length) {
                        yesButtons[2].textContent = persuasiveMessages[noCount];
                        yesSize += 0.2;
                        yesButtons[2].style.transform = `scale(${yesSize})`;

                        noCount++;
                    } else {
                        document.getElementById('page3Text').textContent = "Okay, I'll stop asking... but I'm sad 😢";
                        // Create sad hearts
                        for (let j = 0; j < 5; j++) {
                            setTimeout(() => {
                                const heart = document.createElement('div');
                                heart.className = 'heart';
                                heart.innerHTML = '💔';
                                heart.style.left = Math.random() * window.innerWidth + 'px';
                                heart.style.top = window.innerHeight + 'px';
                                heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                                document.body.appendChild(heart);

                                setTimeout(() => {
                                    heart.remove();
                                }, 3000);
                            }, j * 200);
                        }
                    }
                });
            } else if (i < pages.length - 1) {
                // Move away for other pages (except last)
                noButtons[i].addEventListener('mouseover', () => moveButton(noButtons[i], pages[i]));
                noButtons[i].addEventListener('click', () => moveButton(noButtons[i], pages[i]));
            } else {
                // On last page, make No button sad
                noButtons[i].addEventListener('click', () => {
                    document.querySelector('#page5 h2').textContent = "Please reconsider? 🥺";
                    // Create sad hearts
                    for (let j = 0; j < 5; j++) {
                        setTimeout(() => {
                            const heart = document.createElement('div');
                            heart.className = 'heart';
                            heart.innerHTML = '💔';
                            heart.style.left = Math.random() * window.innerWidth + 'px';
                            heart.style.top = window.innerHeight + 'px';
                            heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                            document.body.appendChild(heart);

                            setTimeout(() => {
                                heart.remove();
                            }, 3000);
                        }, j * 200);
                    }
                });
            }
        }

        function moveButton(button, container) {
            const containerRect = container.getBoundingClientRect();

            // Calculate maximum positions to keep button within container
            const maxX = containerRect.width - button.offsetWidth - 40; // padding
            const maxY = containerRect.height - button.offsetHeight - 40; // padding

            // Generate random positions within container bounds
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Apply new positions
            button.style.position = 'absolute';
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
        }

        function createRandomHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.top = window.innerHeight + 'px';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 3000);
        }

        // Additional pixel effect - random blinking pixels
        document.addEventListener('DOMContentLoaded', () => {
            const bg = document.querySelector('.pixel-bg');
            const size = 20;

            function createBlinkingPixel() {
                const pixel = document.createElement('div');
                pixel.style.position = 'absolute';
                pixel.style.width = size + 'px';
                pixel.style.height = size + 'px';
                pixel.style.backgroundColor = `rgba(255, ${Math.floor(Math.random() * 150 + 105)}, ${Math.floor(Math.random() * 180 + 75)}, 0.7)`;
                pixel.style.left = Math.floor(Math.random() * window.innerWidth / size) * size + 'px';
                pixel.style.top = Math.floor(Math.random() * window.innerHeight / size) * size + 'px';
                pixel.style.opacity = '0';
                pixel.style.transition = 'opacity 0.5s';
                bg.appendChild(pixel);

                setInterval(() => {
                    pixel.style.opacity = Math.random() > 0.7 ? '1' : '0';
                }, Math.random() * 2000 + 500);
            }

            for (let i = 0; i < 30; i++) {
                createBlinkingPixel();
            }
        });

        function startHeartExplosion() {
    const explosionContainer = document.createElement('div');
    explosionContainer.className = 'heart-explosion';
    document.getElementById('page5').appendChild(explosionContainer);

    // Create hearts continuously
    const heartInterval = setInterval(() => {
        for (let i = 0; i < 5; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.bottom = '-20px';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            explosionContainer.appendChild(heart);

            // Remove heart after animation completes
            setTimeout(() => {
                heart.remove();
            }, 4000);
        }
    }, 300);

    // Store interval so we could clear it later if needed
    explosionContainer.heartInterval = heartInterval;
}
    </script>
</body>

</html>
