<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to my beloved baby</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .button-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }
        #yes-btn, #second-yes-btn, #third-yes-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: all 0.3s;
            width: 80px;
            font-size: 25px;
        }
        #no-btn, #second-no-btn, #third-no-btn {
            background-color: #f44336;
            color: white;
            width: 80px;
            border: none;
            font-size: 25px;
            border-radius: 5px;
            position: relative;
        }
        .media-container {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .gif-image {
            width: 300px;
            height: auto;
            object-fit: contain;
            max-width: 100%;
        }
        .page {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: pink;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #first-page {
            display: flex;
        }
        
        /* Enhanced Heart Effects */
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff0000"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>') no-repeat center center;
            background-size: contain;
            opacity: 0.6;
            animation: float linear infinite;
        }
        
        /* Multiple animation types for variety */
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) translateX(calc(var(--random-x) * 100px)) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes float2 {
            0% {
                transform: translateY(100vh) translateX(50vw) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
                transform: translateY(50vh) translateX(25vw) rotate(180deg) scale(1);
            }
            100% {
                transform: translateY(-10vh) translateX(0) rotate(360deg) scale(0.5);
                opacity: 0;
            }
        }
        
        @keyframes float3 {
            0% {
                transform: translate(calc(var(--random-x) * 20vw), 100vh) rotate(0deg) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            100% {
                transform: translate(calc(var(--random-x) * 40vw), -20vh) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }
        
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgba(255, 192, 203, 0.9);
            z-index: 100;
        }
        .celebration h1 {
            color: red;
            font-size: 3em;
            animation: pulse 1s infinite;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* Sparkle effects for celebration */
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: gold;
            border-radius: 50%;
            animation: sparkle 1.5s ease-out infinite;
            pointer-events: none;
        }
        @keyframes sparkle {
            0% {
                transform: scale(0) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(1) translate(var(--sparkle-x), var(--sparkle-y));
                opacity: 0;
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .gif-image {
                width: 200px;
            }
            button {
                padding: 8px 16px;
                font-size: 14px;
            }
            .celebration h1 {
                font-size: 2em;
            }
        }

        .image img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts-container"></div>
    <div class="celebration" id="celebration">
        <h1>Yay! I'm so happy! ❤️</h1>
    </div>

    <!-- First Page -->
    <div id="first-page" class="page">
        <div class="media-container">
            <img class="gif-image" src="qoobee.gif" alt="Animated GIF">
        </div>
        <h2>Can I ask you a question?</h2>
        <div class="button-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <!-- Second Page -->
    <div id="second-page" class="page">
        <div class="media-container">
            <img class="gif-image" src="hellokitty.gif" alt="Animated GIF">
        </div>
        <h2>will you go to a moa date with me?</h2>
        <div class="button-container">
            <button id="second-yes-btn">Yes</button>
            <button id="second-no-btn">No</button>
        </div>
    </div>

    <!-- Third Page -->
    <div id="third-page" class="page">
        <div class="image">
            <img src="love-1.png" alt="" id="img1">
            <img src="love-2.png" alt="" id="img2">
            <img src="love.png" alt="" id="img3">
        </div>
        <h2>YAYYY ilove you</h2>
    </div>

    <script>
        // Create initial hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            const heartCount = 30;
            
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                
                // Random properties for each heart
                const size = Math.random() * 20 + 10;
                const animationType = Math.floor(Math.random() * 3) + 1;
                const duration = Math.random() * 10 + 10;
                const delay = Math.random() * 5;
                const left = Math.random() * 100;
                const color = `hsl(${Math.random() * 60 + 330}, 100%, 70%)`; // Pink/red colors
                
                heart.style.width = `${size}px`;
                heart.style.height = `${size}px`;
                heart.style.left = `${left}vw`;
                heart.style.setProperty('--random-x', Math.random() > 0.5 ? 1 : -1);
                heart.style.animation = `float${animationType > 1 ? animationType : ''} ${duration}s linear ${delay}s infinite`;
                heart.style.filter = `drop-shadow(0 0 2px ${color})`;
                heart.style.color = color;
                
                container.appendChild(heart);
            }
        }
        
        // Create sparkles for celebration
        function createSparkles() {
            const container = document.getElementById('celebration');
            const sparkleCount = 50;
            
            for (let i = 0; i < sparkleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                
                // Random properties
                const size = Math.random() * 8 + 3;
                const delay = Math.random() * 1.5;
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;
                const endX = (Math.random() - 0.5) * 200;
                const endY = (Math.random() - 0.5) * 200;
                
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${startX}%`;
                sparkle.style.top = `${startY}%`;
                sparkle.style.setProperty('--sparkle-x', `${endX}px`);
                sparkle.style.setProperty('--sparkle-y', `${endY}px`);
                sparkle.style.animationDelay = `${delay}s`;
                sparkle.style.backgroundColor = `hsl(${Math.random() * 60 + 40}, 100%, 50%)`; // Yellow/orange colors
                
                container.appendChild(sparkle);
            }
        }

        // Page navigation function
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.style.display = 'none';
            });
            document.getElementById(pageId).style.display = 'flex';
            resetAllGifs();
        }

        // First page buttons
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        
        noBtn.addEventListener('mouseover', () => moveButton(noBtn));
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton(noBtn);
        });
        yesBtn.addEventListener('click', () => showPage('second-page'));

        // Second page buttons
        const secondNoBtn = document.getElementById('second-no-btn');
        const secondYesBtn = document.getElementById('second-yes-btn');
        let scaleFactor = 1;
        
        secondNoBtn.addEventListener('click', (e) => {
            e.preventDefault();
            scaleFactor += 0.5;
            secondYesBtn.style.transform = `scale(${scaleFactor})`;
            secondYesBtn.style.zIndex = '2';
            
            // Make it cover the whole screen when big enough
            if (scaleFactor > 5) {
                secondYesBtn.style.width = '100vw';
                secondYesBtn.style.height = '100vh';
                secondYesBtn.style.position = 'fixed';
                secondYesBtn.style.top = '0';
                secondYesBtn.style.left = '0';
                secondYesBtn.style.borderRadius = '0';
            }
        });
        secondYesBtn.addEventListener('click', () => showPage('third-page'));

        // Third page buttons
        const thirdNoBtn = document.getElementById('third-no-btn');
        const thirdYesBtn = document.getElementById('third-yes-btn');
        let thirdScaleFactor = 1;
        
        thirdNoBtn.addEventListener('click', (e) => {
            e.preventDefault();
            thirdScaleFactor += 0.5;
            thirdYesBtn.style.transform = `scale(${thirdScaleFactor})`;
            thirdYesBtn.style.zIndex = '2';
            
            // Make it cover the whole screen when big enough
            if (thirdScaleFactor > 5) {
                thirdYesBtn.style.width = '100vw';
                thirdYesBtn.style.height = '100vh';
                thirdYesBtn.style.position = 'fixed';
                thirdYesBtn.style.top = '0';
                thirdYesBtn.style.left = '0';
                thirdYesBtn.style.borderRadius = '0';
            }
        });
        thirdYesBtn.addEventListener('click', () => {
            createHearts();
            createSparkles();
            document.getElementById('celebration').style.display = 'flex';
        });

        // Helper functions
        function moveButton(btn) {
            const padding = 20; // Minimum 20px from edges
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;
            
            // Ensure the button stays within visible boundaries
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            btn.style.position = 'absolute';
            btn.style.left = `${randomX}px`;
            btn.style.top = `${randomY}px`;
        }

        function resetGif(imgElement) {
            const originalSrc = imgElement.src;
            imgElement.src = '';
            setTimeout(() => {
                imgElement.src = originalSrc + '?' + new Date().getTime();
            }, 50);
        }

        function resetAllGifs() {
            document.querySelectorAll('.gif-image').forEach(resetGif);
        }

        // Initialize
        createHearts(); // Create background hearts immediately
        resetAllGifs();
        setInterval(resetAllGifs, 5000);
        
        // Create new hearts periodically
        setInterval(() => {
            const hearts = document.querySelectorAll('.heart');
            if (hearts.length < 50) {
                createHearts();
            }
        }, 3000);
    </script>
</body>
</html>
